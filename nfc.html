<!DOCTYPE html>
<html lang="es">
<head>

  <title>LOPEZTECH — Tarjeta Digital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0a1628 0%, #0f1f3d 50%, #0a1628 100%);
      padding: 2rem 1rem;
    }
    .card {
      width: 100%;
      max-width: 400px;
      background: rgba(255,255,255,0.04);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 28px;
      padding: 2.5rem 2rem;
      text-align: center;
      animation: fadeIn 0.6s ease;
    }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }

    .logo-wrap {
      width: 90px; height: 90px;
      margin: 0 auto 1.2rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #1A6FD4, #3B8BEA);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 32px rgba(26,111,212,0.3);
    }
    .logo-wrap img {
      width: 60px; height: 60px;
      border-radius: 50%;
      object-fit: cover;
    }

    .name {
      font-size: 22px; font-weight: 800; color: #fff;
      margin-bottom: 4px;
    }
    .tagline {
      font-size: 13px; color: rgba(255,255,255,0.5);
      margin-bottom: 2rem;
      letter-spacing: 0.5px;
    }

    .links {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .link-btn {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 20px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .link-btn:hover { transform: translateY(-2px); }

    .link-btn .icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 20px;
    }

    /* WhatsApp */
    .link-wa {
      background: rgba(37,211,102,0.1);
      border: 1px solid rgba(37,211,102,0.3);
      color: #25D366;
    }
    .link-wa .icon { background: rgba(37,211,102,0.15); }
    .link-wa:hover { box-shadow: 0 8px 24px rgba(37,211,102,0.2); }

    /* Instagram */
    .link-ig {
      background: rgba(225,48,108,0.1);
      border: 1px solid rgba(225,48,108,0.3);
      color: #E1306C;
    }
    .link-ig .icon { background: rgba(225,48,108,0.15); }
    .link-ig:hover { box-shadow: 0 8px 24px rgba(225,48,108,0.2); }

    /* Google */
    .link-gg {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
    }
    .link-gg .icon { background: rgba(255,255,255,0.1); }
    .link-gg:hover { box-shadow: 0 8px 24px rgba(255,255,255,0.08); }

    .footer {
      margin-top: 2rem;
      font-size: 11px;
      color: rgba(255,255,255,0.25);
    }
  </style>
</head>
